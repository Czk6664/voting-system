<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投票结果展示</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body {
            background: #f5f5f5;
        }
        .display-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .display-header {
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 40px;
        }
        .display-header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .results-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .result-bar {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .result-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .bar-container {
            height: 40px;
            background: #e9ecef;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }
        .bar-fill {
            height: 100%;
            background: #2b7cff;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 15px;
            color: white;
            font-weight: bold;
        }
        .total-votes {
            text-align: center;
            font-size: 2em;
            margin: 30px 0;
            color: #2b7cff;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="display-container">
        <div class="display-header">
            <h1>📊 实时投票结果</h1>
        </div>

        <div id="noPoll" style="display: none; text-align: center;">
            <div style="background: white; padding: 60px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.1);">
                <div style="font-size: 4em; margin-bottom: 20px;">📭</div>
                <h2 style="color: #666;">当前没有进行中的投票</h2>
                <p style="color: #999; margin-top: 10px;">请等待管理员开始投票</p>
            </div>
        </div>

        <div id="resultsCard" class="results-card" style="display: none;">
            <h2 id="displayTitle" style="text-align: center; margin-bottom: 10px;"></h2>
            <p id="displayDescription" style="text-align: center; color: #6c757d; margin-bottom: 30px;"></p>
            
            <div class="total-votes">
                总票数: <span id="totalVotes">0</span>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px;">
                <div>
                    <h3 style="text-align: center; margin-bottom: 15px; color: #2b7cff; font-weight: 600;">饼图</h3>
                    <canvas id="pieChart"></canvas>
                </div>
                <div>
                    <h3 style="text-align: center; margin-bottom: 15px; color: #2b7cff; font-weight: 600;">柱状图</h3>
                    <canvas id="barChart"></canvas>
                </div>
            </div>
            
            <div id="resultsContainer"></div>
        </div>
    </div>

    <script>
        let ws;
        let currentPoll = null;
        let pieChart = null;
        let barChart = null;

        function connectWebSocket() {
            ws = new WebSocket(`ws://${window.location.host}`);
            
            ws.onopen = () => {
                console.log('WebSocket连接已建立');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'voteUpdate') {
                    // 投票更新时不显示结果，只显示提示
                    if (currentPoll && data.poll.id === currentPoll.id) {
                        showNoResults();
                    }
                } else if (data.type === 'pollStarted') {
                    currentPoll = data.poll;
                    showNoResults();
                } else if (data.type === 'pollEnded') {
                    // 投票结束后重新加载完整数据（包括totalVotes）
                    if (currentPoll && data.poll.id === currentPoll.id) {
                        loadPollResults(data.poll.id);
                    }
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket错误:', error);
            };
            
            ws.onclose = () => {
                console.log('WebSocket连接已关闭，5秒后重连...');
                setTimeout(connectWebSocket, 5000);
            };
        }

        connectWebSocket();

        async function loadPollResults(pollId) {
            try {
                const response = await fetch(`/api/poll/${pollId}/results`);
                const data = await response.json();
                
                if (data.success && data.poll) {
                    currentPoll = data.poll;
                    currentPoll.totalVotes = data.totalVotes || 0;
                    renderResults();
                }
            } catch (error) {
                console.error('加载投票结果失败', error);
            }
        }

        async function loadCurrentPoll() {
            try {
                const response = await fetch('/api/poll/current');
                const data = await response.json();
                
                if (data.success && data.poll) {
                    currentPoll = data.poll;
                    // 保存总票数
                    currentPoll.totalVotes = data.totalVotes || 0;
                    
                    // 如果投票已结束，加载完整结果
                    if (currentPoll.status === 'ended') {
                        await loadPollResults(currentPoll.id);
                    } else if (!currentPoll.results || Object.keys(currentPoll.results).length === 0) {
                        showNoResults();
                    } else {
                        renderResults();
                    }
                } else {
                    showNoPoll();
                }
            } catch (error) {
                console.error('加载投票失败', error);
                showNoPoll();
            }
        }

        function showNoPoll() {
            document.getElementById('noPoll').style.display = 'block';
            document.getElementById('resultsCard').style.display = 'none';
        }
        
        function showNoResults() {
            document.getElementById('noPoll').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
            
            document.getElementById('displayTitle').textContent = currentPoll.title;
            document.getElementById('displayDescription').textContent = currentPoll.description || '';
            document.getElementById('totalVotes').textContent = '投票进行中';
            
            // 隐藏图表
            document.getElementById('pieChart').parentElement.parentElement.style.display = 'none';
            
            // 显示提示信息
            const container = document.getElementById('resultsContainer');
            container.innerHTML = `
                <div style="text-align: center; padding: 60px 20px; background: #fff3cd; border-radius: 15px; border: 2px solid #ffc107;">
                    <div style="font-size: 4em; margin-bottom: 20px;">🔒</div>
                    <h2 style="color: #856404; margin-bottom: 15px;">投票结果保密中</h2>
                    <p style="color: #856404; font-size: 1.1em;">投票正在进行中，结果仅管理员可见</p>
                    <p style="color: #856404; margin-top: 10px;">投票结束后将公开结果</p>
                </div>
            `;
        }

        function renderResults() {
            if (!currentPoll) {
                showNoPoll();
                return;
            }
            
            // 如果投票还在进行中，不显示结果
            if (currentPoll.status === 'active') {
                showNoResults();
                return;
            }
            
            // 检查是否有结果数据
            if (!currentPoll.results || Object.keys(currentPoll.results).length === 0) {
                showNoResults();
                return;
            }

            document.getElementById('noPoll').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';
            
            // 显示图表区域
            const chartArea = document.getElementById('pieChart').parentElement.parentElement;
            if (chartArea) chartArea.style.display = 'grid';
            
            document.getElementById('displayTitle').textContent = currentPoll.title;
            document.getElementById('displayDescription').textContent = currentPoll.description || '';
            
            // 计算总票数（根据投票类型）
            let totalVotes = 0;
            if (currentPoll.type === 'election') {
                // 差额选举：使用保存的totalVotes或计算投票人数
                totalVotes = currentPoll.totalVotes || 0;
            } else {
                // 普通投票：累加所有选项的票数
                totalVotes = Object.values(currentPoll.results).reduce((a, b) => a + b, 0);
            }
            document.getElementById('totalVotes').textContent = totalVotes;
            
            // 准备图表数据
            let labels, dataValues;
            if (currentPoll.type === 'election') {
                // 差额选举：使用赞成票数
                labels = Object.keys(currentPoll.results || {});
                dataValues = labels.map(name => {
                    const result = currentPoll.results[name];
                    return (result && result.approve) || 0;
                });
            } else {
                // 普通投票
                labels = currentPoll.options || [];
                dataValues = labels.map(opt => currentPoll.results[opt] || 0);
            }
            
            // 如果没有数据，不显示图表
            if (labels.length === 0 || dataValues.every(v => v === 0)) {
                document.getElementById('pieChart').parentElement.parentElement.style.display = 'none';
                return;
            }
            const colors = [
                '#2b7cff', '#1a6ae8', '#5b9cff', '#8bb8ff',
                '#00c9a7', '#ff6b9d', '#ffc542', '#c44569'
            ];
            
            // 更新或创建饼图
            const pieCtx = document.getElementById('pieChart').getContext('2d');
            if (pieChart) {
                pieChart.data.labels = labels;
                pieChart.data.datasets[0].data = dataValues;
                pieChart.update();
            } else {
                pieChart = new Chart(pieCtx, {
                    type: 'pie',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: dataValues,
                            backgroundColor: colors.slice(0, labels.length),
                            borderWidth: 2,
                            borderColor: '#fff'
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    color: '#333',
                                    font: {
                                        size: 14
                                    }
                                }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                        const percentage = total > 0 ? ((context.parsed / total) * 100).toFixed(1) : 0;
                                        return `${context.label}: ${context.parsed} 票 (${percentage}%)`;
                                    }
                                }
                            }
                        }
                    }
                });
            }
            
            // 更新或创建柱状图
            const barCtx = document.getElementById('barChart').getContext('2d');
            if (barChart) {
                barChart.data.labels = labels;
                barChart.data.datasets[0].data = dataValues;
                barChart.update();
            } else {
                barChart = new Chart(barCtx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '票数',
                            data: dataValues,
                            backgroundColor: colors.slice(0, labels.length),
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    stepSize: 1,
                                    color: '#333'
                                }
                            },
                            x: {
                                ticks: {
                                    color: '#333'
                                }
                            }
                        }
                    }
                });
            }
            
            // 渲染详细结果列表
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';
            
            if (currentPoll.type === 'election') {
                // 差额选举结果显示
                const results = currentPoll.results || {};
                Object.keys(results).forEach(name => {
                    const result = results[name];
                    const approve = result.approve || 0;
                    const reject = result.reject || 0;
                    const abstain = result.abstain || 0;
                    const total = approve + reject + abstain;
                    const approvePercent = total > 0 ? ((approve / total) * 100).toFixed(1) : 0;
                    
                    const resultDiv = document.createElement('div');
                    resultDiv.className = 'result-bar';
                    if (result.isAlternative) {
                        resultDiv.style.background = '#fff3cd';
                        resultDiv.style.border = '2px solid #ffc107';
                    }
                    
                    resultDiv.innerHTML = `
                        <div class="result-label">
                            <span style="font-weight: 700;">${name}${result.isAlternative ? ' (另选)' : ''}</span>
                            <span style="color: #28a745; font-weight: bold;">赞成 ${approve}</span>
                        </div>
                        <div style="font-size: 0.9em; color: #666; margin-bottom: 10px;">
                            ✓ 赞成: ${approve} | ✗ 不赞成: ${reject} | ○ 弃权: ${abstain} | 得票率: ${approvePercent}%
                        </div>
                        <div class="bar-container">
                            <div class="bar-fill" style="width: ${approvePercent}%; background: #28a745;">
                                ${approvePercent}%
                            </div>
                        </div>
                    `;
                    
                    container.appendChild(resultDiv);
                });
            } else {
                // 普通投票结果显示
                currentPoll.options.forEach(option => {
                    const votes = currentPoll.results[option] || 0;
                    const percentage = totalVotes > 0 ? (votes / totalVotes * 100).toFixed(1) : 0;
                    
                    const resultDiv = document.createElement('div');
                    resultDiv.className = 'result-bar';
                    
                    resultDiv.innerHTML = `
                        <div class="result-label">
                            <span>${option}</span>
                            <span>${votes} 票 (${percentage}%)</span>
                        </div>
                        <div class="bar-container">
                            <div class="bar-fill" style="width: ${percentage}%">
                                ${percentage}%
                            </div>
                        </div>
                    `;
                    
                    container.appendChild(resultDiv);
                });
            }
        }

        loadCurrentPoll();
        
        // 每5秒刷新一次
        setInterval(loadCurrentPoll, 5000);
    </script>
</body>
</html>
