name = "voting-system"
main = "src/worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# KV 命名空间（用于存储静态文件）
[[kv_namespaces]]
binding = "STATIC_ASSETS"
id = "placeholder"

# 环境变量
[vars]
ADMIN_PASSWORD = "admin123"

# Secrets（敏感信息，使用 wrangler secret put 设置）
# SUPABASE_URL
# SUPABASE_ANON_KEY

# 构建配置
[build]
command = "npm install"

# 路由配置（可选）
# routes = [
#   { pattern = "voting-system.你的域名.com", zone_name = "你的域名.com" }
# ]
