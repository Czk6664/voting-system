name = "voting-system"
main = "src/index.js"
compatibility_date = "2024-01-01"

# KV 命名空间（用于存储投票数据）
[[kv_namespaces]]
binding = "VOTING_DATA"
id = "placeholder"  # 部署时会自动创建

# KV 命名空间（用于存储静态文件）
[[kv_namespaces]]
binding = "VOTING_STATIC"
id = "placeholder"  # 部署时会自动创建

# 环境变量
[vars]
ADMIN_PASSWORD = "admin123"  # 部署后记得修改
